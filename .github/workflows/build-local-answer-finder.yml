name: Build local answer finder
on:
  push:
    branches:
      - feat/local-answer-link-finder
    paths:
      - "tools/local-answer-finder/**"
      - ".github/workflows/build-local-answer-finder.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/local-answer-finder/**"
      - ".github/workflows/build-local-answer-finder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/local-answer-finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
      - name: Compile and smoke test
        run: |
          python -m compileall -q app.py finder.py
          python -c "from pathlib import Path; from finder import read_books, assess; p=Path('smoke.csv'); p.write_text('id,title,publisher\\n1,테스트 수학,테스트 출판사\\n',encoding='utf-8-sig'); rows=read_books(p); assert rows[0]['id']=='1'; assert assess(rows[0], '테스트 수학 정답과 해설', '정답과 해설', ['정답과 해설'])[1]=='likely'; p.unlink()"
      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name DapjiMoumFinder --collect-all playwright --collect-all greenlet --collect-all pyee app.py
          Copy-Item "$env:LOCALAPPDATA\\ms-playwright" "dist\\DapjiMoumFinder\\ms-playwright" -Recurse
          Copy-Item README.md, sources.example.json -Destination "dist\\DapjiMoumFinder"
          Compress-Archive -Path "dist\\DapjiMoumFinder\\*" -DestinationPath "답지모음-로컬-탐색기-Windows.zip" -Force
      - name: Verify packaged executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist\\DapjiMoumFinder\\DapjiMoumFinder.exe")) { throw "EXE not found" }
          if (!(Test-Path "dist\\DapjiMoumFinder\\ms-playwright")) { throw "Bundled Chromium not found" }
      - uses: actions/upload-artifact@v4
        with:
          name: 답지모음-로컬-탐색기-Windows
          path: tools/local-answer-finder/답지모음-로컬-탐색기-Windows.zip
          retention-days: 30
