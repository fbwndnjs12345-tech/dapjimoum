name: Admin V2 build and edge-function QA

on:
  push:
    branches:
      - feat/admin-search-workspace-v2
  pull_request:
    branches:
      - feat/admin-workspace-multitab-content

permissions:
  contents: read

jobs:
  web-build:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and production build
        run: npm run build

  edge-functions:
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check search and health-check functions
        run: |
          deno check supabase/functions/answer-link-search/index.ts
          deno check supabase/functions/answer-link-health-check/index.ts

  schema-contract:
    name: Non-destructive schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify V2 schema and app contract
        run: node scripts/verify-admin-v2-contract.mjs

  sql-syntax:
    name: PostgreSQL migration syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL parser
        run: pip install pglast
      - name: Parse V2 migrations
        run: python scripts/verify-admin-v2-sql.py

  local-database-migrations:
    name: Apply all migrations to isolated Supabase local database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply all migrations from an empty local database
        run: supabase db reset --local
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
